<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Figure 2 - DFT-GEN focus mode comparison</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    /* UI copied from dft-gen-expert-spot-check (index.html) */
    :root {
      --ink: #1d2533;
      --muted: #657084;
      --paper: #f8f5ee;
      --panel: #fffdf8;
      --line: #d8d0c2;
      --blue: #235789;
      --blue-soft: #d9eafa;
      --green: #31785f;
      --shadow: 0 18px 45px rgba(50, 45, 35, .12);
      --reader-font: "Atkinson Hyperlegible", "Lexend", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
      --reader-size: 16px;
      --reader-line-height: 1.8;
      --reader-letter-spacing: .018em;
      --reader-word-spacing: .08em;
      --mask-height: 42px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Atkinson Hyperlegible", "Lexend", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 0%, rgba(35, 87, 137, .14), transparent 32rem),
        radial-gradient(circle at 90% 20%, rgba(49, 120, 95, .12), transparent 28rem),
        linear-gradient(135deg, #fbf8f0, #efe8dc);
      line-height: 1.55;
    }
    header {
      max-width: 1180px;
      margin: 0 auto;
      padding: 36px 22px 12px;
    }
    .eyebrow {
      display: inline-block;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .62);
      color: var(--blue);
      font: 700 12px/1.2 "Lexend", sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 14px 0 8px;
      font-family: "Lexend", "Atkinson Hyperlegible", sans-serif;
      font-size: clamp(26px, 4vw, 40px);
      line-height: 1.05;
      letter-spacing: -.03em;
    }
    .subtitle { max-width: 900px; margin: 0; color: var(--muted); font-size: 16px; }
    .counts { margin-top: 10px; color: var(--muted); font-size: 13px; }
    main {
      max-width: 1180px;
      margin: 0 auto 48px;
      padding: 0 22px 32px;
    }
    .display-controls {
      margin-bottom: 18px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 253, 248, .82);
      box-shadow: var(--shadow);
    }
    .display-controls h2 { margin: 0 0 6px; font-size: 22px; }
    .display-controls p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
    .control-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 14px;
    }
    .control {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.62);
      padding: 12px;
    }
    .control label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--ink);
      font: 800 12px "Lexend", sans-serif;
      text-transform: uppercase;
      letter-spacing: .03em;
    }
    .control output { color: var(--blue); font-weight: 800; text-transform: none; letter-spacing: 0; }
    .control input[type="range"], .control select {
      width: 100%;
      accent-color: var(--blue);
    }
    .control select {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px 8px;
      background: #fffdf8;
      color: var(--ink);
      font: 13px "Lexend", sans-serif;
    }
    .control-actions { display: flex; align-items: end; }
    .control-actions button { width: 100%; }
    button {
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--panel);
      color: var(--ink);
      font: 700 13px "Lexend", sans-serif;
    }
    button:hover { box-shadow: 0 8px 22px rgba(0,0,0,.10); }
    .sample {
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255, 253, 248, .95);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .sample-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 22px;
      background: linear-gradient(90deg, rgba(35,87,137,.10), rgba(49,120,95,.08));
      border-bottom: 1px solid var(--line);
    }
    .sample-id { font: 800 15px "Lexend", sans-serif; }
    .badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      background: white;
      border: 1px solid var(--line);
      color: var(--blue);
      font: 700 12px "Lexend", sans-serif;
    }
    .texts {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      padding: 18px;
    }
    .text-box {
      min-height: 190px;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 0;
      background: #fffaf0;
      overflow: hidden;
    }
    .text-box h3 {
      margin: 0;
      padding: 13px 15px 9px;
      font: 800 13px "Lexend", sans-serif;
      color: var(--blue);
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .reading-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 12px 10px;
    }
    .reading-tools button {
      padding: 6px 9px;
      font-size: 11px;
      background: #f3efe6;
    }
    .reader-stage {
      --focus-top: 22px;
      --focus-height: var(--mask-height);
      position: relative;
      border-top: 1px solid var(--line);
      background: #fffdf8;
    }
    .text-content {
      max-height: 365px;
      overflow: auto;
      padding: 16px 17px 22px;
      white-space: pre-wrap;
      font-family: var(--reader-font);
      font-size: var(--reader-size);
      line-height: var(--reader-line-height);
      letter-spacing: var(--reader-letter-spacing);
      word-spacing: var(--reader-word-spacing);
    }
    .text-content.reader-html { white-space: normal; }
    .text-content.reader-html p { margin: 0 0 10px; }
    .text-content strong {
      font-weight: 800;
      color: #0f3f6b;
      background: rgba(217, 234, 250, .78);
      border-radius: 5px;
      padding: 0 .12em;
    }
    .text-content mark {
      background: #ffe680;
      color: #1d2533;
      border-radius: 5px;
      padding: 0 .14em;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .focus-mask, .focus-window {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      pointer-events: none;
      z-index: 3;
    }
    .focus-mask.top {
      top: 0;
      height: var(--focus-top);
      background: rgba(0, 0, 0, .70);
    }
    .focus-mask.bottom {
      top: calc(var(--focus-top) + var(--focus-height));
      bottom: 0;
      background: rgba(0, 0, 0, .70);
    }
    .focus-window {
      top: var(--focus-top);
      height: var(--focus-height);
      left: 8px;
      right: 8px;
      border-top: 2px solid rgba(255, 230, 128, .95);
      border-bottom: 2px solid rgba(255, 230, 128, .95);
      box-shadow: 0 0 0 1px rgba(255,255,255,.26) inset;
    }
    .reader-stage.focus-on .focus-mask,
    .reader-stage.focus-on .focus-window { display: block; }
    .hint-bar {
      margin: 0 18px 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.55);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
    .footnote { margin-top: 14px; color: var(--muted); font-size: 12px; }
    @media (max-width: 900px) {
      .texts, .control-grid { grid-template-columns: 1fr; }
    }
    @media print {
      .display-controls, .hint-bar, .footnote a { display: none !important; }
      body { background: white; }
    }
  </style>
</head>
<body>
  <header>
    <span class="eyebrow">Figure 2 - Study 2 interface example</span>
    <h1 id="artifact-title"></h1>
    <p class="subtitle" id="artifact-subtitle"></p>
    <p class="counts" id="char-counts"></p>
  </header>

  <main>
    <section class="display-controls" aria-label="Reading display controls">
      <h2>Reading display</h2>
      <div class="control-grid">
        <div class="control">
          <label for="fontSelect">Friendly font <output id="fontLabel">Atkinson</output></label>
          <select id="fontSelect">
            <option value="atkinson">Atkinson Hyperlegible</option>
            <option value="lexend">Lexend</option>
            <option value="yahei">Microsoft YaHei UI</option>
            <option value="verdana">Verdana</option>
            <option value="arial">Arial</option>
          </select>
        </div>
        <div class="control">
          <label for="textSize">Text size <output id="textSizeLabel">16px</output></label>
          <input id="textSize" type="range" min="14" max="24" step="1" value="16">
        </div>
        <div class="control">
          <label for="lineSpacing">Line spacing <output id="lineSpacingLabel">1.80</output></label>
          <input id="lineSpacing" type="range" min="1.3" max="2.4" step="0.05" value="1.8">
        </div>
        <div class="control">
          <label for="letterSpacing">Letter spacing <output id="letterSpacingLabel">0.02em</output></label>
          <input id="letterSpacing" type="range" min="0" max="0.12" step="0.005" value="0.018">
        </div>
        <div class="control">
          <label for="wordSpacing">Word spacing <output id="wordSpacingLabel">0.08em</output></label>
          <input id="wordSpacing" type="range" min="0" max="0.35" step="0.01" value="0.08">
        </div>
        <div class="control">
          <label for="maskHeight">Mask window size <output id="maskHeightLabel">42px</output></label>
          <input id="maskHeight" type="range" min="24" max="90" step="2" value="42">
        </div>
        <div class="control control-actions">
          <button type="button" id="resetReading">Reset reading display</button>
        </div>
      </div>
    </section>

    <article class="sample" id="screenshot-area">
      <div class="sample-head">
        <div>
          <span class="sample-id" id="sample-id">S1</span>
          <span class="badge">British Museum - Greek sculpture</span>
        </div>
      </div>
      <div class="texts" id="texts-root"></div>
    </article>

    <p class="footnote">
      <a href="https://github.com/MorrisYUJQ/museum-stimuli">museum-stimuli</a> ·
      UI from <a href="https://github.com/MorrisYUJQ/dft-gen-expert-spot-check">dft-gen-expert-spot-check</a> - English version for manuscript screenshot
    </p>
  </main>

  <script>
    const DATA = {
    "title": "The Parthenon",
    "title_en": "British Museum example - Greek sculpture",
    "stimulus_id": "S1",
    "original_html": "<p>The Parthenon was built as a temple dedicated to the goddess Athena. It was the centrepiece of an ambitious building programme on the Acropolis of Athens. The temple's great size and lavish use of white marble was intended to show off the city's power and wealth at the height of its empire. Room 18 at the British Museum exhibits sculptures that once decorated the outside of the building.</p>\n<p>The pediments and metopes, the square spaces between triglyphs in a Doric frieze, illustrate episodes from Greek myth. The frieze represents the people of contemporary Athens in religious procession. Rooms 18a and 18b feature fragments of the Parthenon sculpture and pieces of architecture. Video displays using computer graphics explain how the sculptures were placed on the building.</p>\n<p>The word parthenos meant 'maiden', 'girl', or 'virgin, unmarried woman'. Inside the original building stood a colossal image of Athena Parthenos, constructed of gold and ivory. The temple was richly decorated with sculptures designed by the famous artist Pheidias, which took until 432 BC to complete.</p>\n<p>The Parthenon sculptures have been on permanent display since 1817. The frieze shows the procession of the Panathenaic festival, the commemoration of the birthday of the goddess Athena. On either end of the main room are transepts displaying sculptures from the east and west pediments, including Iris, goddess of the rainbow, and Dionysos. On the walls are metopes carved in high relief.</p>",
    "helper_html": "<p>The Parthenon was a temple for Athena.</p>\n<p>It stood on the Acropolis in Athens.</p>\n<p>It was very large and made with white marble.</p>\n<p>The building showed the power and wealth of Athens.</p>\n<p>The British Museum displays sculptures from the outside of the temple.</p>\n<p>Some sculptures show Greek myths.</p>\n<p>The frieze shows a religious procession in Athens.</p>\n<p>The procession was part of a festival for Athena.</p>\n<p>The sculptures were designed by Pheidias.</p>\n<p>They have been displayed in the British Museum since 1817.</p>\n<p>Some sculptures show Iris and Dionysos.</p>\n<p>The museum also uses videos to explain where the sculptures were placed.</p>",
    "dft_focus_text": "[Object] The Parthenon was built as a temple dedicated to the goddess ==Athena==.\n\n[Place] It was the centrepiece of an ambitious building programme on the ==Acropolis of Athens==.\n\n[Visual message] Its great size and lavish ==white marble== showed the city's power and wealth at the height of its empire.\n\n[Museum display] Room 18 at the British Museum exhibits sculptures that once decorated the outside of the building.\n\n[Architecture] The ==pediments== and ==metopes== illustrate Greek myth; metopes are square spaces between triglyphs in a Doric frieze.\n\n[Civic life] The ==frieze== represents the people of contemporary Athens in a religious procession.\n\n[Gallery rooms] Rooms 18a and 18b feature fragments of Parthenon sculpture and pieces of architecture.\n\n[Key term] ==Parthenos== meant 'maiden', 'girl', or 'virgin, unmarried woman'.\n\n[Lost statue] Inside stood a colossal gold-and-ivory image of ==Athena Parthenos==.\n\n[Artist] Sculptures designed by ==Pheidias== were completed by ==432 BC==.\n\n[Festival] The frieze shows the ==Panathenaic festival== procession, commemorating the birthday of Athena.\n\n[Display history] The Parthenon sculptures have been on permanent display since ==1817==.\n\n[Gallery layout] Transepts at either end display east and west pediment sculptures, including ==Iris== and ==Dionysos==.\n\n[Detail] Metopes on the walls are carved in high relief.\n\n[Technology] Video displays using computer graphics explain how the sculptures were placed on the building.\n\n[Accessibility] The gallery also uses video displays and a touch tour for visually impaired visitors.",
    "word_counts": {
        "stimulus_id": "S1",
        "title": "The Parthenon",
        "original_words": 235,
        "helper_words": 99,
        "dft_focus_words": 236
    }
};

    const PREFS_STORAGE_KEY = 'table4-reading-display-en-v1';
    const DEFAULT_PREFS = {
      font: 'atkinson',
      textSize: 18,
      lineSpacing: 1.8,
      letterSpacing: 0.018,
      wordSpacing: 0.08,
      maskHeight: 42
    };
    const FONT_STACKS = {
      atkinson: '"Atkinson Hyperlegible", "Lexend", "Noto Sans SC", "Microsoft YaHei UI", sans-serif',
      lexend: '"Lexend", "Atkinson Hyperlegible", "Noto Sans SC", sans-serif',
      yahei: '"Microsoft YaHei UI", "Noto Sans SC", "Atkinson Hyperlegible", sans-serif',
      verdana: 'Verdana, "Microsoft YaHei UI", sans-serif',
      arial: 'Arial, "Microsoft YaHei UI", sans-serif'
    };
    const FONT_LABELS = {
      atkinson: 'Atkinson',
      lexend: 'Lexend',
      yahei: 'YaHei UI',
      verdana: 'Verdana',
      arial: 'Arial'
    };

    const fontSelect = document.getElementById('fontSelect');
    const textSizeInput = document.getElementById('textSize');
    const lineSpacingInput = document.getElementById('lineSpacing');
    const letterSpacingInput = document.getElementById('letterSpacing');
    const wordSpacingInput = document.getElementById('wordSpacing');
    const maskHeightInput = document.getElementById('maskHeight');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function renderText(value) {
      let s = escapeHtml(value);
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/==([^=]+)==/g, '<mark>$1</mark>');
      return s;
    }

    function setFocusPosition(stage, index) {
      const content = stage.querySelector('.text-content');
      const computed = window.getComputedStyle(content);
      const lineHeight = Number.parseFloat(computed.lineHeight) || 34;
      const focusHeight = Number.parseFloat(
        window.getComputedStyle(stage).getPropertyValue('--focus-height')
      ) || lineHeight;
      const step = Math.max(lineHeight, focusHeight * 0.75);
      const visibleSlots = Math.max(0, Math.floor((stage.clientHeight - focusHeight - 16) / step));
      const scrollSlots = Math.max(0, Math.ceil((content.scrollHeight - content.clientHeight) / step));
      const maxVisibleIndex = Math.max(visibleSlots, scrollSlots);
      const nextIndex = Math.max(0, Math.min(index, maxVisibleIndex));
      stage.dataset.focusIndex = String(nextIndex);
      const focusTop = 12 + Math.min(nextIndex, visibleSlots) * step;
      stage.style.setProperty('--focus-top', focusTop + 'px');
      content.scrollTop = Math.max(0, (nextIndex - visibleSlots) * step);
    }

    function textPanel(panelId, title, body, options = {}) {
      const { asHtml = false, focusDefault = false } = options;
      const content = asHtml
        ? `<div class="text-content reader-html">${body}</div>`
        : `<div class="text-content">${renderText(body)}</div>`;
      const focusClass = focusDefault ? ' focus-on' : '';
      const toggleLabel = focusDefault ? 'Hide mask' : 'Focus line';
      return `
        <section class="text-box">
          <h3>${escapeHtml(title)}</h3>
          <div class="reading-tools" aria-label="Reading focus controls for ${escapeHtml(title)}">
            <button type="button" data-mask-toggle="${panelId}">${toggleLabel}</button>
            <button type="button" data-mask-move="${panelId}" data-direction="-1">Move up</button>
            <button type="button" data-mask-move="${panelId}" data-direction="1">Move down</button>
          </div>
          <div class="reader-stage${focusClass}" id="${panelId}" data-focus-index="0">
            ${content}
            <div class="focus-mask top"></div>
            <div class="focus-window"></div>
            <div class="focus-mask bottom"></div>
          </div>
        </section>`;
    }

    function initReaderTools(root) {
      const bindTarget = root === document ? document.documentElement : root;
      if (bindTarget.dataset.readerToolsBound === 'true') return;
      bindTarget.dataset.readerToolsBound = 'true';
      root.addEventListener('click', (event) => {
        const toggle = event.target.closest('[data-mask-toggle]');
        const move = event.target.closest('[data-mask-move]');
        if (!toggle && !move) return;
        const targetId = (toggle || move).dataset.maskToggle || (toggle || move).dataset.maskMove;
        const stage = document.getElementById(targetId);
        if (!stage) return;
        if (toggle) {
          stage.classList.toggle('focus-on');
          toggle.textContent = stage.classList.contains('focus-on') ? 'Hide mask' : 'Focus line';
          setFocusPosition(stage, Number(stage.dataset.focusIndex || 0));
          return;
        }
        const direction = Number(move.dataset.direction || 0);
        stage.classList.add('focus-on');
        const tools = move.closest('.reading-tools');
        const toggleButton = tools?.querySelector('[data-mask-toggle]');
        if (toggleButton) toggleButton.textContent = 'Hide mask';
        setFocusPosition(stage, Number(stage.dataset.focusIndex || 0) + direction);
      });
    }

    function loadPrefs() {
      try { return { ...DEFAULT_PREFS, ...(JSON.parse(localStorage.getItem(PREFS_STORAGE_KEY)) || {}) }; }
      catch { return { ...DEFAULT_PREFS }; }
    }
    function savePrefs(prefs) {
      try {
        localStorage.setItem(PREFS_STORAGE_KEY, JSON.stringify(prefs));
      } catch {
        // Local files or strict browser settings may block localStorage.
        // Reading controls should still apply immediately.
      }
    }
    function currentPrefsFromControls() {
      return {
        font: fontSelect.value,
        textSize: Number(textSizeInput.value),
        lineSpacing: Number(lineSpacingInput.value),
        letterSpacing: Number(letterSpacingInput.value),
        wordSpacing: Number(wordSpacingInput.value),
        maskHeight: Number(maskHeightInput.value)
      };
    }
    function setControlValues(prefs) {
      fontSelect.value = prefs.font;
      textSizeInput.value = prefs.textSize;
      lineSpacingInput.value = prefs.lineSpacing;
      letterSpacingInput.value = prefs.letterSpacing;
      wordSpacingInput.value = prefs.wordSpacing;
      maskHeightInput.value = prefs.maskHeight;
    }
    function updateControlLabels(prefs) {
      document.getElementById('fontLabel').textContent = FONT_LABELS[prefs.font] || 'Custom';
      document.getElementById('textSizeLabel').textContent = `${prefs.textSize}px`;
      document.getElementById('lineSpacingLabel').textContent = prefs.lineSpacing.toFixed(2);
      document.getElementById('letterSpacingLabel').textContent = `${prefs.letterSpacing.toFixed(3)}em`;
      document.getElementById('wordSpacingLabel').textContent = `${prefs.wordSpacing.toFixed(2)}em`;
      document.getElementById('maskHeightLabel').textContent = `${prefs.maskHeight}px`;
    }
    function applyReadingPrefs(prefs) {
      document.documentElement.style.setProperty('--reader-font', FONT_STACKS[prefs.font] || FONT_STACKS.atkinson);
      document.documentElement.style.setProperty('--reader-size', `${prefs.textSize}px`);
      document.documentElement.style.setProperty('--reader-line-height', prefs.lineSpacing);
      document.documentElement.style.setProperty('--reader-letter-spacing', `${prefs.letterSpacing}em`);
      document.documentElement.style.setProperty('--reader-word-spacing', `${prefs.wordSpacing}em`);
      document.documentElement.style.setProperty('--mask-height', `${prefs.maskHeight}px`);
      updateControlLabels(prefs);
      document.querySelectorAll('.reader-stage.focus-on').forEach(stage => {
        setFocusPosition(stage, Number(stage.dataset.focusIndex || 0));
      });
    }
    function bindReadingControls() {
      const controls = [fontSelect, textSizeInput, lineSpacingInput, letterSpacingInput, wordSpacingInput, maskHeightInput];
      controls.forEach(control => {
        const handler = () => {
          const prefs = currentPrefsFromControls();
          savePrefs(prefs);
          applyReadingPrefs(prefs);
        };
        control.addEventListener('input', handler);
        control.addEventListener('change', handler);
      });
      document.getElementById('resetReading').addEventListener('click', () => {
        const prefs = { ...DEFAULT_PREFS };
        setControlValues(prefs);
        savePrefs(prefs);
        applyReadingPrefs(prefs);
      });
    }

    function init() {
      document.getElementById('artifact-title').textContent = DATA.title;
      document.getElementById('artifact-subtitle').textContent =
        DATA.title_en + ' · ' + DATA.stimulus_id;
      document.getElementById('sample-id').textContent = DATA.stimulus_id;
      const wc = DATA.word_counts;
      document.getElementById('char-counts').textContent =
        'Word count: Original ' + wc.original_words +
        ' - Dyslexia Helper ' + wc.helper_words +
        ' - DFT-GEN Focus ' + wc.dft_focus_words;

      document.getElementById('texts-root').innerHTML =
        textPanel('panel-original', 'Original text', DATA.original_html, { asHtml: true }) +
        textPanel('panel-helper', 'Dyslexia Helper', DATA.helper_html, { asHtml: true }) +
        textPanel('panel-dft', 'DFT-GEN (Focus Mode)', DATA.dft_focus_text, { asHtml: false, focusDefault: true });

      initReaderTools(document);
      const prefs = loadPrefs();
      setControlValues(prefs);
      applyReadingPrefs(prefs);
      bindReadingControls();
      requestAnimationFrame(() => {
        document.querySelectorAll('.reader-stage.focus-on').forEach(stage => {
          setFocusPosition(stage, Number(stage.dataset.focusIndex || 0));
        });
      });
    }

    init();
  </script>
</body>
</html>
